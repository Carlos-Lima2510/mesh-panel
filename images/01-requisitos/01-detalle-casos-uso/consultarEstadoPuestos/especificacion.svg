0.364" fill="#000" font-size="13" textLength="298.771">[Infraestructura de monitorización disponible]</text><text x="29" y="325.497" fill="#000" font-size="13" textLength="58.906" font-weight="700">Sistema</text><text x="92.039" y="325.497" fill="#000" font-size="13" textLength="564.7">presenta la cuadrícula del aula con los puestos organizados en hileras y pasillo central</text><text x="29" y="340.629" fill="#000" font-size="13" textLength="58.906" font-weight="700">Sistema</text><text x="92.039" y="340.629" fill="#000" font-size="13" textLength="449.795">presenta el diagnóstico semafórico, IP, boca y switch de cada puesto</text><text x="29" y="355.762" fill="#000" font-size="13" textLength="58.906" font-weight="700">Sistema</text><text x="92.039" y="355.762" fill="#000" font-size="13" textLength="403.73">presenta el resumen de métricas consolidadas del laboratorio</text><text x="29" y="370.895" fill="#000" font-size="13" textLength="58.906" font-weight="700">Sistema</text><text x="92.039" y="370.895" fill="#000" font-size="13" textLength="110.595">permite solicitar:</text><text x="29" y="386.028" fill="#000" font-size="13" textLength="314.069">• el encendido remoto de un puesto en Standby</text><text x="29" y="401.161" fill="#000" font-size="13" textLength="355.577">• la consulta de la ficha técnica y detalle de un puesto</text><text x="29" y="416.293" fill="#000" font-size="13" textLength="326.479">• la selección de puestos individuales o en bloque</text><text x="29" y="431.426" fill="#000" font-size="13" textLength="372.855">• el cambio de modo operativo del aula (Clase / Práctica)</text><text x="29" y="446.559" fill="#000" font-size="13" textLength="337.061">• la actualización manual del estado del laboratorio</text></g><!--link c to *end*consultarEstadoPuestos--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk10" data-source-line="31" data-link-type="dependency"><path d="M367.61,260.257 C422.97,265.297 676,288.297 676,288.297 C676,288.29