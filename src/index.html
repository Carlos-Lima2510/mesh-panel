<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría de Puestos - Consulta a Demanda</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-scan {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #3b82f6;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-scan:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-scan:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h2>Telemetría del Laboratorio</h2>
      <div id="conn-status" class="status-badge" style="margin-top: 6px;">
        <span class="pulse"></span> <span>Consultas a demanda</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-scan" class="btn-scan">
        <span id="btn-scan-icon">🔄</span>
        <span id="btn-scan-text">Consultar Estado Puestos</span>
      </button>

      <div class="kpi-box">
        <div class="kpi"><span class="dot" style="background: var(--verde)"></span> Operativos: <span id="kV">0</span>
        </div>
        <div class="kpi"><span class="dot" style="background: var(--amarillo)"></span> Fallo DHCP: <span
            id="kA">0</span></div>
        <div class="kpi"><span class="dot" style="background: var(--naranja)"></span> Aislados: <span id="kN">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
