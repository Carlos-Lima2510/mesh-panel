<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría de Puestos - Panel de Observabilidad</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="header-brand">
      <h2>Telemetría del Laboratorio</h2>
      <div id="conn-status" class="status-badge">
        <span class="pulse"></span> <span>Consultas a demanda</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="mode-selector">
        <button id="btn-mode-clase" class="btn-mode active-clase" type="button">
          🎓 Modo Clase
        </button>
        <button id="btn-mode-practica" class="btn-mode" type="button">
          🧪 Modo Práctica
        </button>
      </div>

      <button id="btn-scan" class="btn-scan" type="button">
        <span id="btn-scan-icon">🔄</span>
        <span id="btn-scan-text">Consultar Estado Puestos</span>
      </button>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Buscar por puesto, IP, MAC o boca switch (ej. UEA-C236, port1)..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Buscar puestos"
      >
      <button id="btn-clear-search" class="search-clear" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" style="display: none;">&times;</button>
    </div>

    <!-- Controles de Cuadrícula Dinámica (Filas x Columnas por Hilera) -->
    <div class="grid-dimension-controls" aria-label="Dimensiones de la Cuadrícula">
      <span class="toolbar-label">Cuadrícula:</span>
      <div class="dim-inputs">
        <label for="input-filas" class="dim-label">Filas:</label>
        <input type="number" id="input-filas" class="input-dim" min="1" max="20" value="5" title="Número de filas de mesas" />
        <span class="dim-sep">&times;</span>
        <label for="input-columnas" class="dim-label">Cols/Hilera:</label>
        <input type="number" id="input-columnas" class="input-dim" min="1" max="20" value="4" title="Columnas a cada lado del pasillo central" />
        <button id="btn-aplicar-cuadricula" class="btn-subtle" type="button" title="Aplicar cuadrícula (pasillo en medio siempre)">
          📐 Aplicar
        </button>
      </div>
    </div>

    <!-- Herramienta de Asignación de Switch por Rango -->
    <div class="switch-assign-tool" aria-label="Asignación de Switch por Rango">
      <span class="toolbar-label">Switch Rango:</span>
      <div class="range-inputs">
        <span class="range-text">#</span>
        <input type="number" id="input-range-desde" class="input-dim" min="1" value="1" title="Puesto inicial" />
        <span class="range-text">a</span>
        <input type="number" id="input-range-hasta" class="input-dim" min="1" value="20" title="Puesto final" />
        <select id="select-range-switch" class="select-range-switch" title="Switch destino">
          <option value="sw-docente">Sw. Docente</option>
          <option value="sw-practicas" selected>Sw. Prácticas</option>
        </select>
        <button id="btn-aplicar-rango-switch" class="btn-subtle" type="button" title="Asignar switch a este rango de puestos">
          ⚡ Asignar
        </button>
      </div>
    </div>

    <div class="classroom-summary">
      <span id="total-puestos-badge" class="summary-tag">40 Puestos</span>
      <span id="grid-dims-badge" class="summary-tag">5 Filas &times; 4+4 Cols</span>
    </div>
  </section>

  <!-- CUADRÍCULA DINÁMICA DEL AULA (PASILLO EN EL MEDIO SIEMPRE) -->
  <main class="classroom-container">
    <div class="classroom-headers" id="classroom-headers">
      <div class="corner-header">Fila</div>
      <div class="col-header" id="header-left-col">Hilera Izquierda (4 cols)</div>
      <div class="aisle-header">Pasillo Central</div>
      <div class="col-header" id="header-right-col">Hilera Derecha (4 cols)</div>
      <div class="corner-header">Fila</div>
    </div>

    <div class="classroom-grid" id="classroom-grid">
      <!-- filas generadas dinámicamente con pasillo en medio siempre -->
    </div>
  </main>

  <script type="module" src="js/app.js?v=20261114_03"></script>
</body>

</html>
