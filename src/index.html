<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría de Puestos - Panel de Observabilidad</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div>
      <h2>Telemetría del Laboratorio</h2>
      <div id="conn-status" class="status-badge" style="margin-top: 6px;">
        <span class="pulse"></span> <span>Consultas a demanda</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="mode-selector">
        <button id="btn-mode-clase" class="btn-mode active-clase" type="button">
          🎓 Modo Clase
        </button>
        <button id="btn-mode-practica" class="btn-mode" type="button">
          🧪 Modo Práctica
        </button>
      </div>

      <div class="distribution-selector">
        <label for="select-distribucion" class="dist-label">📐 Plano:</label>
        <select id="select-distribucion" class="select-distribucion" aria-label="Seleccionar plano de distribución">
          <option value="dist-aula-56">Disposición Aula (56)</option>
          <option value="dist-examen">Disposición Examen (28)</option>
        </select>
      </div>

      <button id="btn-toggle-edit" class="btn-edit-layout" type="button" title="Activar modo para arrastrar y reorganizar puestos">
        <span id="btn-edit-icon">✏️</span>
        <span id="btn-edit-text">Reorganizar</span>
      </button>

      <button id="btn-scan" class="btn-scan" type="button">
        <span id="btn-scan-icon">🔄</span>
        <span id="btn-scan-text">Consultar Estado Puestos</span>
      </button>

      <div class="kpi-box" id="kpi-box" role="group" aria-label="Filtro rápido por estado">
        <button type="button" class="kpi active" data-filter="ALL" id="kpi-filter-all" title="Mostrar todos los puestos">
          <span class="dot" style="background: var(--text);"></span> Todos: <span id="kT">0</span>
        </button>
        <button type="button" class="kpi" data-filter="VERDE" id="kpi-filter-verde" title="Filtrar por puestos operativos">
          <span class="dot" style="background: var(--verde);"></span> Operativos: <span id="kV">0</span>
        </button>
        <button type="button" class="kpi" data-filter="AMARILLO" id="kpi-filter-amarillo" title="Filtrar por fallo DHCP o red aislada">
          <span class="dot" style="background: var(--amarillo);"></span> Fallo DHCP / Práctica: <span id="kA">0</span>
        </button>
        <button type="button" class="kpi" data-filter="GRIS" id="kpi-filter-gris" title="Filtrar por puestos apagados">
          <span class="dot" style="background: var(--gris);"></span> Apagados: <span id="kG">0</span>
        </button>
        <button type="button" class="kpi" data-filter="NARANJA" id="kpi-filter-naranja" title="Filtrar por cables desconectados">
          <span class="dot" style="background: var(--naranja);"></span> Desconectados: <span id="kN">0</span>
        </button>
      </div>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Buscar por puesto, IP, MAC o boca switch (ej. PC-01, P12)..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Buscar puestos"
      >
      <button id="btn-clear-search" class="search-clear" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" style="display: none;">&times;</button>
    </div>

    <div class="filter-status-box">
      <span id="filter-counter" class="filter-counter">Mostrando <strong>0</strong> de <strong>0</strong> puestos</span>
      <button id="btn-reset-filters" class="btn-reset-filters" type="button" style="display: none;">
        ✕ Restablecer filtros
      </button>
    </div>
  </section>

  <!-- BANNER MODO REORGANIZACIÓN ESPACIAL -->
  <div id="edit-mode-banner" class="edit-mode-banner" style="display: none;">
    <div class="edit-banner-content">
      <span>✏️ <strong>Modo Reorganización Activo:</strong> Arrastra un puesto o haz clic sobre un equipo y luego en otra mesa para moverlo o intercambiarlo.</span>
    </div>
    <button id="btn-done-edit" type="button" class="btn-done-edit">Guardar y Finalizar</button>
  </div>

  <!-- DISTRIBUCIÓN DIRECTA DEL AULA: 56 PUESTOS (2 HILERAS DE 5 COLUMNAS Y PASILLO CENTRAL) -->
  <main class="classroom-container">
    <div class="classroom-headers">
      <div></div>
      <div class="col-header">Hilera Izquierda (Puestos 1 - 28)</div>
      <div class="aisle-header">Pasillo</div>
      <div class="col-header">Hilera Derecha (Puestos 29 - 56)</div>
    </div>

    <div class="classroom-grid" id="classroom-grid">
      <!-- 6 filas de escritorios con tarjetas de tamaño idéntico y estricto -->
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
