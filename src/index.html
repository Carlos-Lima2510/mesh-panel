<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría de Puestos - Panel de Observabilidad</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="header-brand">
      <h2>Telemetría del Laboratorio</h2>
      <div id="conn-status" class="status-badge">
        <span class="pulse"></span> <span>Consultas a demanda</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="mode-selector">
        <button id="btn-mode-clase" class="btn-mode active-clase" type="button">
          🎓 Modo Clase
        </button>
        <button id="btn-mode-practica" class="btn-mode" type="button">
          🧪 Modo Práctica
        </button>
      </div>

      <button id="btn-scan" class="btn-scan" type="button">
        <span id="btn-scan-icon">🔄</span>
        <span id="btn-scan-text">Consultar Estado Puestos</span>
      </button>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Buscar por puesto, IP, MAC o boca switch (ej. UEA-C236, port1)..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Buscar puestos"
      >
      <button id="btn-clear-search" class="search-clear" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" style="display: none;">&times;</button>
    </div>

    <div class="classroom-summary">
      <span class="summary-tag">40 Puestos Fijos</span>
      <span class="summary-tag">2 Hileras &times; 4 Columnas</span>
    </div>
  </section>

  <!-- DISTRIBUCIÓN FIJA DEL AULA: 40 PUESTOS (2 HILERAS DE 4 COLUMNAS X 5 FILAS Y PASILLO CENTRAL) -->
  <main class="classroom-container">
    <div class="classroom-headers" id="classroom-headers">
      <div class="corner-header">Fila</div>
      <div class="col-header">Hilera Izquierda (4 columnas)</div>
      <div class="aisle-header">Pasillo</div>
      <div class="col-header">Hilera Derecha (4 columnas)</div>
    </div>

    <div class="classroom-grid" id="classroom-grid">
      <!-- 5 filas generadas dinámicamente -->
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
